name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: filetree233-windows-x64.exe
            exe: filetree233.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: filetree233-windows-arm64.exe
            exe: filetree233.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: filetree233-linux-x64
            exe: filetree233
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: filetree233-linux-arm64
            exe: filetree233
          - os: macos-14
            target: aarch64-apple-darwin
            asset: filetree233-macos-arm64
            exe: filetree233
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: filetree233-macos-x64
            exe: filetree233
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Verify real NTFS fast path
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          FILETREE233_TEST_LIVE_MFT: '1'
          FILETREE233_TEST_FAST_ONLY: '1'
        run: cargo test --release --locked --target ${{ matrix.target }} --test mft_live -- --nocapture
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify installers with the actual release executable
        env:
          FILETREE233_INSTALL_TEST_BINARY: target/${{ matrix.target }}/release/${{ matrix.exe }}
        run: cargo test --release --locked --target ${{ matrix.target }} --test installer -- --ignored --nocapture
      - shell: bash
        run: |
          "target/${{ matrix.target }}/release/${{ matrix.exe }}" --version
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check assets and hashes
        shell: bash
        run: |
          cd artifacts
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum filetree233-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
  verify_installed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    uses: ./.github/workflows/install-check.yml
    with:
      version: ${{ github.ref_name }}
