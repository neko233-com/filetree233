[package]
name = "filetree233"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Disk space analysis and human-confirmed cleanup with a treemap GUI, CLI and MCP server"
license = "MIT"
repository = "https://github.com/neko233-com/filetree233"
homepage = "https://github.com/neko233-com/filetree233"
readme = "README.md"
keywords = ["disk-usage", "treemap", "cleanup", "cli", "mcp"]
categories = ["command-line-utilities", "filesystem", "gui"]

[features]
default = []
# Interactive treemap desktop app; release builds enable it for Windows and macOS only.
gui = ["dep:eframe", "dep:image"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ntfs-mft = "0.1.0"

eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["disk"] }
globset = "0.4"
csv = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target."cfg(not(windows))".dependencies]
trash = "5.2.9"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
filetime = "0.2.29"
trash = "5.2.9"

[profile.release]
lto = "thin"
strip = true
